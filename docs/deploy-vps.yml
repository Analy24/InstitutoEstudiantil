name: CI/CD Deployment to VPS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Build & Deploy ArticulApp
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Deploy via SSH to VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script: |
            echo "🚀 Iniciando despliegue de ArticulApp..."
            cd /var/www/articulapp
            
            echo "📥 Trayendo últimos cambios de Git..."
            git pull origin main
            
            echo "📦 Compilando Frontend..."
            cd frontend
            npm install
            npm run build
            cd ..
            
            echo "⚙️ Actualizando dependencias de Backend..."
            cd backend
            npm install --production
            cd ..
            
            echo "🔄 Reiniciando aplicación con PM2..."
            pm2 reload articulapp-backend || pm2 start backend/src/server.js --name "articulapp-backend"
            
            echo "✅ Despliegue completado exitosamente."
